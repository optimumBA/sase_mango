name: PR
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
jobs:
  deploy_preview_app:
    name: Deploy preview app
    permissions: write-all
    runs-on: ubuntu-latest
    concurrency:
      group: pr-${{ github.event.number }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: optimum-bh
      FLY_REGION: fra
      PHX_HOST: pr-${{ github.event.number }}-sase-mango.fly.dev
      REPO_NAME: sase_mango
    environment:
      name: pr-${{ github.event.number }}-sase-mango
      url: https://${{ env.PHX_HOST }}
    steps:
      - uses: actions/checkout@v2
      - name: Delete previous deployments
        uses: strumwolf/delete-deployment-environment@v2.2.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: pr-${{ github.event.number }}-sase-mango
          ref: ${{ github.head_ref }}
          onlyRemoveDeployments: true
      - name: Deploy preview app
        uses: almirsarajcic/fly-pr-review-apps@remote-builder
        with:
          name: pr-${{ github.event.number }}-sase-mango
          secrets: ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }} MAXMIND_LICENSE_KEY=${{ secrets.MAXMIND_LICENSE_KEY }} PHX_HOST=${{ env.PHX_HOST }} SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE }}
          vm_memory: 1024
