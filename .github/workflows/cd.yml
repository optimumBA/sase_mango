name: CD
on:
  - push
  - workflow_dispatch
jobs:
  deploy:
    name: Deploy to Fly.io
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v2
      - uses: superfly/flyctl-actions@1.1
        with:
          args: deploy
