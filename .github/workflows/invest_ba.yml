name: Invest.ba

on:
  schedule:
    # Every weekday at 3 PM UTC
    # - cron: "0 15 * * 1-5"
    - cron: "8 18 * * 1-5"

jobs:
  create_post:
    name: Create post
    runs-on: ubuntu-latest
    env:
      INVEST_BA_URL: ${{ secrets.INVEST_BA_URL }}
      INVEST_BA_USERNAME: ${{ secrets.INVEST_BA_USERNAME }}
      INVEST_BA_PASSWORD: ${{ secrets.INVEST_BA_PASSWORD }}

    services:
      db:
        image: postgres:12
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v2

      - name: Set up Elixir
        uses: erlef/setup-elixir@885971a72ed1f9240973bd92ab57af8c1aa68f24
        with:
          elixir-version: "1.12.0"
          otp-version: "24.0.1"

      - uses: actions/cache@v2
        with:
          path: |
            _build
            deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Create post
        run: mix invest_ba.create_post
