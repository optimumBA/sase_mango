# fly.toml app configuration file generated for sase-mango-test on 2023-06-22T21:34:58+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "sase-mango-test"
primary_region = "fra"
kill_signal = "SIGTERM"

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000
